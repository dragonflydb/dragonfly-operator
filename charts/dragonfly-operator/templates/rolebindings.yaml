apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dragonfly-operator.fullname" . }}-leader-election-rolebinding
  labels:
    {{- include "dragonfly-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
  namespace: {{ include "dragonfly-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dragonfly-operator.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "dragonfly-operator.serviceAccountName" . }}
    namespace: {{ include "dragonfly-operator.namespace" . }}
{{- if .Values.watchNamespaces }}
{{- range $ns := splitList "," .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dragonfly-operator.fullname" $ }}-manager-rolebinding
  namespace: {{ $ns | trim }}
  labels:
    {{- include "dragonfly-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dragonfly-operator.fullname" $ }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "dragonfly-operator.serviceAccountName" $ }}
    namespace: {{ include "dragonfly-operator.namespace" $ }}
{{- end }}
{{- end }}