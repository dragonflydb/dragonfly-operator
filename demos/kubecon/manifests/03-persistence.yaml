# Demo 3 — Persistence: periodic snapshots to a PersistentVolumeClaim.
# Story: "Your data survives a pod restart." Write keys, snapshot, kill the pod,
# show the keys come back after the operator restores from the snapshot dir.
# The demo cron is aggressive (every minute) so you don't wait around at the booth;
# in production you'd use something like "0 */6 * * *".
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: df-persist
  labels:
    demo: kubecon
spec:
  replicas: 1
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  snapshot:
    cron: "*/1 * * * *"          # every minute, for the demo
    enableOnMasterOnly: false
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
